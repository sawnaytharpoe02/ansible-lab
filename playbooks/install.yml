---
- hosts: web_nodes
  become: true
  tasks:
    - name: install htop package on remote servers
      apk:
        name: htop
        state: present
      when: ansible_distribution == "Alpine"

    - name: install htop package on remote servers
      yum:
        name: htop
        state: present
      when: ansible_distribution == "CentOS"

    - name: install nginx package on remote servers
      apt:
        name: nginx
        state: present
      when: ansible_distribution == "Ubuntu"