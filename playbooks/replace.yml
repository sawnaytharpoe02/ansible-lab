---
- hosts: web_node1
  become: true
  tasks:
    - name: replace text in file
      replace:
        path: /usr/share/nginx/html/file.txt
        regexp: 'SNTP'
        replace: 'sawnaytharpoe'

- hosts: web_node2
  become: true
  tasks:
    - name: replace text in file
      replace:
        path: /usr/share/nginx/html/file.txt
        regexp: 'SNTP'
        replace: 'Developer'